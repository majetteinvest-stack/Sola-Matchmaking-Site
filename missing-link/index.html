<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="A discreet matchmaking community for matured singles who are ready for companionship, love and a lasting partnership.">
<meta name="robots" content="noindex">
<title>The Missing Link — Matchmaking for matured singles</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20rx%3D%225%22%20fill%3D%22%230E7A55%22/%3E%3Csvg%20viewBox%3D%220%200%2024%2024%22%20transform%3D%22scale%28.8%29%20translate%283%203%29%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%3E%3Ccircle%20cx%3D%229.2%22%20cy%3D%2212%22%20r%3D%225.1%22/%3E%3Ccircle%20cx%3D%2214.8%22%20cy%3D%2212%22%20r%3D%225.1%22/%3E%3C/svg%3E%3C/svg%3E">
<style>
:root{
  --bg:#FBF8F1; --bg-glass:rgba(251,248,241,.93); --hero-bg:#FDFBF6;
  --sand:#F2EDE2; --tint:#E6F1EA; --white:#fff;
  --line:#E4DCCB; --line-s:#D8CFBC;
  --ink:#16302A; --ink-2:#41564E; --muted:#6B7C74;
  --primary:#0E7A55; --primary-d:#0A5E41; --on-primary:#fff;
  --accent:#D9962A; --accent-d:#A8710E; --on-accent:#3B2900;
  --focus:#EFD9A6;
  --red:#B03A2E; --red-bg:#FAEDEB; --red-line:#E9CCC7;
  --ok:#0A5E41; --ok-bg:#DCEFE5;
  --warn:#8A6A10; --warn-bg:#FBF1D8; --warn-line:#EBDCA9;
  --scrim:rgba(16,48,42,.55);
  --side-txt:#D5E5DD; --side-mut:#7FA391; --foot-link:#B9DCC9;
  --display:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --dw:600; --dls:-.015em;
  --card-r:16px; --btn-r:999px; --in-r:10px; --mark-r:50%;
  --sh:0 1px 2px rgba(16,48,42,.06),0 8px 22px rgba(16,48,42,.06);
  --sh-lg:0 2px 6px rgba(16,48,42,.06),0 18px 44px rgba(16,48,42,.09);
  --btn-sh:0 2px 8px rgba(14,122,85,.18);
  --rule:linear-gradient(90deg,#0E7A55 0 34%,#D9962A 34% 66%,#0E7A55 66%);
  --tex:radial-gradient(#CFE3D7 1.1px,transparent 1.2px),radial-gradient(#CFE3D7 1.1px,transparent 1.2px);
  --tex-size:26px 26px; --tex-pos:0 0,13px 13px; --tex-op:.5;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:var(--dw);line-height:1.15;margin:0 0 .5em;letter-spacing:var(--dls)}
h1{font-size:clamp(2.1rem,5vw,3.5rem)}
h2{font-size:clamp(1.5rem,3vw,2.15rem)}
h3{font-size:1.14rem}
p{margin:0 0 1em}
a{color:var(--primary-d)}
img{max-width:100%}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.narrow{max-width:720px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-d);font-weight:800;margin-bottom:14px}

/* decorative backdrop */
.tex{background-image:var(--tex);background-size:var(--tex-size);background-position:var(--tex-pos)}

/* nav */
header.nav{position:sticky;top:0;z-index:50;background:var(--bg-glass);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.rule{height:4px;background:var(--rule)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 24px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;text-decoration:none;color:var(--ink)}
.brand .mark{width:36px;height:36px;border-radius:var(--mark-r);background:var(--primary);display:grid;place-items:center;flex:none}
.brand .mark svg{width:20px;height:20px;display:block}
.brand b{font-family:var(--display);font-size:19px;font-weight:var(--dw);letter-spacing:var(--dls);display:block;line-height:1.15}
.brand small{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);font-family:var(--sans);font-weight:600}
.nav-links{display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-size:14.5px;font-weight:700;padding:11px 20px;border-radius:var(--btn-r);border:1.5px solid transparent;cursor:pointer;text-decoration:none;transition:.15s;white-space:nowrap;line-height:1.2}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--btn-sh)}
.btn-primary:hover{background:var(--primary-d)}
.btn-accent{background:var(--accent);color:var(--on-accent);box-shadow:var(--btn-sh)}
.btn-accent:hover{background:var(--accent-d)}
.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line-s)}
.btn-ghost:hover{background:var(--sand);border-color:var(--primary)}
.btn-quiet{background:transparent;color:var(--muted);border-color:transparent;padding:9px 12px;font-weight:600}
.btn-quiet:hover{color:var(--ink);background:var(--sand)}
.btn-danger{background:transparent;color:var(--red);border-color:var(--red-line)}
.btn-danger:hover{background:var(--red-bg)}
.btn-sm{font-size:13px;padding:8px 14px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-block{width:100%}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);background:var(--hero-bg)}
.hero .tex{position:absolute;inset:0;opacity:var(--tex-op)}
.hero-in{position:relative;padding:82px 0 74px;display:grid;grid-template-columns:1.12fr .88fr;gap:54px;align-items:center}
.hero p.lede{font-size:18.5px;color:var(--ink-2);max-width:52ch}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}
.trust{margin-top:28px;font-size:13.5px;color:var(--muted);display:flex;gap:18px;flex-wrap:wrap}
.trust span{display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.hero-card{background:var(--white);border:1px solid var(--line);border-radius:var(--card-r);box-shadow:var(--sh-lg);padding:22px}
.hero-card h4{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:800}
.mini{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--sand)}
.mini:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--tint);display:grid;place-items:center;font-family:var(--display);color:var(--primary-d);font-size:15px;font-weight:700;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.mini b{font-size:14.5px;display:block}
.mini small{color:var(--muted);font-size:12.5px}

/* sections */
section{padding:74px 0}
.section-alt{background:var(--sand)}
.section-tint{background:var(--tint)}
.center{text-align:center;max-width:660px;margin:0 auto}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:34px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:36px}
.grid5{display:grid;grid-template-columns:repeat(auto-fit,minmax(186px,1fr));gap:18px;margin-top:36px}
.grid5 .card{padding:22px 20px}
.grid5 h3{font-size:1.08rem}
.grid5 p{font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:30px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--card-r);padding:24px;box-shadow:var(--sh)}
.card-flat{box-shadow:none}
.step-n{width:34px;height:34px;border-radius:var(--mark-r);background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-family:var(--display);font-size:16px;font-weight:700;margin-bottom:15px}
.card p{font-size:14.6px;color:var(--ink-2);margin:0}
.pull{font-family:var(--display);font-size:clamp(1.25rem,2.6vw,1.7rem);line-height:1.35;color:var(--primary-d);max-width:24ch}

/* forms */
.field{margin-bottom:20px}
label.lb{display:block;font-size:13.5px;font-weight:700;margin-bottom:6px}
.hint{font-size:12.8px;color:var(--muted);margin:-2px 0 8px;line-height:1.5}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{
  width:100%;font:inherit;font-size:15px;padding:11px 13px;border:1.5px solid var(--line-s);border-radius:var(--in-r);background:var(--white);color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--primary)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line-s);background:var(--white);border-radius:999px;padding:8px 15px;font-size:13.6px;font-weight:600;cursor:pointer;user-select:none;transition:.12s}
.chip:hover{border-color:var(--primary)}
.chip.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.chip.on.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip.dim{opacity:.45}
.err{color:var(--red);font-size:13px;margin-top:8px;font-weight:600}
.counter{font-size:12.5px;color:var(--muted);margin-top:8px}
.counter b{color:var(--accent-d)}

/* progress */
.prog{display:flex;gap:6px;margin-bottom:9px}
.prog i{height:5px;flex:1;background:var(--line);border-radius:3px;transition:.2s}
.prog i.on{background:var(--accent)}
.stepmeta{font-size:11.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);margin-bottom:24px;font-weight:700}

/* badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--sand);color:var(--muted);white-space:nowrap}
.b-pending{background:var(--warn-bg);color:var(--warn)}
.b-approved,.b-accepted{background:var(--ok-bg);color:var(--ok)}
.b-declined{background:var(--red-bg);color:var(--red)}
.b-paused{background:var(--sand);color:var(--muted)}
.b-proposed{background:var(--tint);color:var(--primary-d)}
.b-talking{background:var(--tint);color:var(--primary-d)}
.b-married{background:var(--warn-bg);color:var(--warn)}

/* tables + admin */
.admin-shell{display:grid;grid-template-columns:216px 1fr;min-height:calc(100vh - 62px)}
.side{background:var(--ink);padding:22px 14px;color:var(--side-txt)}
.side h5{font-family:var(--sans);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-mut);margin:18px 10px 8px;font-weight:800}
.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;color:var(--side-txt);text-decoration:none;font-size:14.2px;cursor:pointer;margin-bottom:2px;font-weight:600}
.side a:hover{background:rgba(255,255,255,.08)}
.side a.on{background:var(--accent);color:var(--on-accent)}
.side .cnt{background:rgba(255,255,255,.16);border-radius:999px;font-size:11.5px;padding:1px 8px;font-weight:700}
.side a.on .cnt{background:rgba(0,0,0,.16)}
.main{padding:28px 30px 80px;min-width:0}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.toolbar select,.toolbar input{width:auto;min-width:150px;font-size:14px;padding:8px 11px}
table{width:100%;border-collapse:collapse;background:var(--white);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:14.2px}
th{text-align:left;background:var(--sand);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:11px 14px;white-space:nowrap;font-weight:800}
td{padding:12px 14px;border-top:1px solid var(--sand);vertical-align:middle}
tr:hover td{background:var(--tint)}
.tname{display:flex;align-items:center;gap:10px}
.tname b{font-size:14.5px}
.tname small{display:block;color:var(--muted);font-size:12.2px}
.empty{text-align:center;padding:52px 20px;color:var(--muted);background:var(--white);border:1.5px dashed var(--line-s);border-radius:14px}

/* profile detail */
.detail{display:grid;grid-template-columns:1fr 330px;gap:24px;align-items:start}
.kv{display:grid;grid-template-columns:186px 1fr;gap:8px 16px;font-size:14.3px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}
.sect-h{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--sand)}
.sect-h:first-child{margin-top:0}
.quote{background:var(--sand);border-left:3px solid var(--accent);padding:12px 16px;border-radius:0 10px 10px 0;margin-bottom:12px;font-size:14.5px}
.quote b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:5px;font-weight:800}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:10px}
.note small{color:var(--muted);font-size:12px;display:block;margin-top:6px}
.note-alert{background:var(--red-bg);border-color:var(--red-line)}
.conduct{background:var(--tint);border-radius:14px;padding:22px;margin:28px 0}
.conduct.dp{background:var(--sand)}
.conduct h4{font-family:var(--sans);font-size:15px;margin-bottom:6px}
.conduct ul{margin:12px 0 0;padding-left:20px}
.conduct li{margin-bottom:9px;font-size:14.6px;color:var(--ink-2);line-height:1.5}
.check{display:flex;gap:11px;align-items:flex-start;margin-top:18px;font-size:14.6px;font-weight:700;cursor:pointer}
.check input{width:19px;height:19px;flex:none;margin:2px 0 0;accent-color:var(--primary)}
.flag{display:flex;gap:9px;align-items:flex-start;font-size:14px;padding:8px 0;border-bottom:1px solid var(--sand)}
.flag:last-child{border-bottom:0}
.flag i{font-style:normal;font-weight:800;flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-size:11px;margin-top:2px}
.flag.ok i{background:var(--ok-bg);color:var(--ok)}
.flag.no i{background:var(--red-bg);color:var(--red)}
.flag.hm i{background:var(--warn-bg);color:var(--warn)}
.flag.db{background:var(--red-bg);border-radius:9px;padding:9px 11px;border-bottom:0;margin-bottom:6px}
.score{font-family:var(--display);font-size:42px;line-height:1;color:var(--primary-d);font-weight:700}

/* deal breakers */
.db-tag{display:inline-flex;align-items:center;gap:6px;background:var(--red-bg);color:var(--red);border:1px solid var(--red-line);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:700;margin:0 6px 6px 0}

/* slate (two options) */
.slate{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}
.opt{background:var(--white);border:2px solid var(--line);border-radius:var(--card-r);padding:20px;display:flex;flex-direction:column;transition:.15s}
.opt:hover{border-color:var(--primary)}
.opt.chosen{border-color:var(--primary);box-shadow:0 0 0 3px var(--tint)}
.opt .top{display:flex;gap:13px;align-items:center;margin-bottom:14px}
.opt .top b{font-family:var(--display);font-size:17.5px;display:block;font-weight:var(--dw)}
.opt .top small{color:var(--muted);font-size:13px}
.opt .grow{flex:1}
.lock{margin-top:14px;padding:11px 13px;background:var(--sand);border-radius:10px;font-size:13.4px;color:var(--muted)}
.vs{display:grid;place-items:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}

/* modal + toast */
.modal-bg{position:fixed;inset:0;background:var(--scrim);display:grid;place-items:center;z-index:100;padding:24px}
.modal{background:var(--bg);border-radius:18px;max-width:660px;width:100%;max-height:86vh;overflow:auto;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.32)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-size:14.5px;z-index:200;box-shadow:0 8px 30px rgba(0,0,0,.25);font-weight:600}
.foot{background:var(--ink);color:var(--side-txt);padding:40px 0;font-size:13.5px}
.foot a{color:var(--foot-link)}
.foot b{color:#fff;font-family:var(--display);font-size:17px;font-weight:var(--dw)}
.foot .tag{margin-top:4px}
.photo-grid{display:flex;gap:10px;flex-wrap:wrap}
.photo-grid .ph{width:96px;height:120px;border-radius:10px;object-fit:cover;border:1px solid var(--line);background:var(--sand)}
.faq{border-top:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:15.5px;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";float:right;color:var(--accent-d);font-weight:800}
.faq[open] summary::after{content:"\2013"}
.faq p{margin:10px 0 0;color:var(--ink-2);font-size:14.8px}

@media(max-width:900px){
  .hero-in{grid-template-columns:1fr;gap:34px;padding:48px 0 52px}
  .grid3,.grid4,.grid5,.split,.grid2,.slate{grid-template-columns:1fr;gap:20px}
  .detail{grid-template-columns:1fr}
  .admin-shell{grid-template-columns:1fr}
  .side{display:flex;gap:6px;overflow-x:auto;padding:12px}
  .side h5{display:none}
  .side a{white-space:nowrap}
  .row2,.row3{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr;gap:2px 0}
  .kv dd{margin-bottom:10px}
  .main{padding:20px 16px 60px}
  table{display:block;overflow-x:auto}
  section{padding:54px 0}
  .nav-in{padding:11px 16px}
  .brand small{display:none}
  .vs{display:none}
}
@media(max-width:520px){
  .nav-links .btn-quiet{display:none}
}

</style>
</head>

    p1: "", p2: "", p3: "", p4: "",
    notes: r.note ? [{ id: uid(), t: Date.now() - i * 86400000, text: r.note }] : []
  }, r));
  DB.members.forEach(m => { delete m.note; });
  DB.slates = (BRAND.seedSlates || []).map(s => {
    const o = Object.assign({ id: uid(), created: Date.now() - 6 * 86400000, log: [{ t: Date.now() - 6 * 86400000, text: "Two options sent" }] }, s);
    if (o.fb) { const fb = {}; Object.keys(o.fb).forEach(k => { const v = Object.assign({}, o.fb[k]); v.t = Date.now() - (v.days || 2) * 86400000; delete v.days; fb[k] = v; }); o.fb = fb; }
    return o;
  });
  DB.seeded = true; save();
}

/* ============================================================
   COMPATIBILITY ENGINE
   ============================================================ */
function compat(a, b) {
  const f = []; let score = 0, max = 0;
  const add = (w, ok, txt) => {
    max += w;
    if (ok === true) { score += w; f.push({ k: "ok", t: txt }); }
    else if (ok === "soft") { score += w * 0.5; f.push({ k: "hm", t: txt }); }
    else { f.push({ k: "no", t: txt }); }
  };
  const A = age(a.dob), B = age(b.dob);

  /* age */
  const aOk = B >= (a.ageMin || 18) && B <= (a.ageMax || 99);
  const bOk = A >= (b.ageMin || 18) && A <= (b.ageMax || 99);
  add(16, aOk && bOk ? true : (aOk || bOk ? "soft" : false),
    `Ages ${A} & ${B}. ` + (aOk && bOk ? "Inside both stated ranges."
      : aOk ? `Outside ${b.first}'s stated range (${b.ageMin}–${b.ageMax}).`
        : bOk ? `Outside ${a.first}'s stated range (${a.ageMin}–${a.ageMax}).`
          : "Outside both stated ranges."));

  /* faith */
  const sameFaith = a.faith === b.faith, sameObs = a.observance === b.observance, sameDen = a.denom === b.denom;
  const verdict = m => {
    if (m.faithReq === "Faith isn't a factor") return true;
    if (m.faithReq === "Must share my faith and level") return sameFaith && sameObs;
    if (m.faithReq === "Must share my faith") return sameFaith;
    return sameFaith ? true : "soft";
  };
  const fa = verdict(a), fb = verdict(b);
  const fRes = (fa === true && fb === true) ? true : (fa === false || fb === false) ? false : "soft";
  add(20, fRes, sameFaith
    ? `Both ${a.faith}${sameDen && a.denom && a.denom !== "N/A" ? " · " + a.denom : ""}. ${sameObs ? "Same level of practice." : `Practice differs: "${a.observance}" vs "${b.observance}".`}`
    : `Different faiths: ${a.faith} / ${b.faith}.${fRes === false ? " At least one of them said this is a hard requirement." : ""}`);

  /* timeline */
  const gap = Math.abs(TIMELINE.indexOf(a.timeline) - TIMELINE.indexOf(b.timeline));
  add(14, gap === 0 ? true : gap === 1 ? "soft" : false, `Intentions: "${a.timeline}" vs "${b.timeline}".`);

  /* children */
  const kOk = (a.kidsWants === "No") === (b.kidsWants === "No");
  const hasKids = [a, b].filter(m => m.kidsHas && m.kidsHas !== "No children").map(m => m.first);
  add(14, kOk ? (a.kidsWants === b.kidsWants ? true : "soft") : false,
    `Children: ${a.first} — ${a.kidsWants}; ${b.first} — ${b.kidsWants}.` + (hasKids.length ? ` ${hasKids.join(" and ")} already ${hasKids.length > 1 ? "have" : "has"} children.` : ""));

  /* location */
  const near = sameArea(a, b);
  const willMove = m => m.relocate && m.relocate.indexOf("Yes") === 0;
  add(12, near ? true : (willMove(a) || willMove(b)) ? "soft" : false,
    near ? `Both in ${place(a)}.` : `${place(a)} / ${place(b)}. ` + (willMove(a) || willMove(b) ? "At least one is open to relocating." : "Neither is eager to move."));

  /* family involvement */
  const fam = OPT.family.slice().reverse();
  const fgap = Math.abs(fam.indexOf(a.familyInv) - fam.indexOf(b.familyInv));
  add(8, fgap <= 1 ? true : fgap === 2 ? "soft" : false, `Family involvement: "${a.familyInv}" vs "${b.familyInv}".`);

  /* lifestyle */
  const lvl = { "Never": 0, "Socially": 1, "Regularly": 2 };
  const lg = Math.abs((lvl[a.drink] || 0) - (lvl[b.drink] || 0)) + Math.abs((lvl[a.smoke] || 0) - (lvl[b.smoke] || 0));
  add(8, lg === 0 ? true : lg === 1 ? "soft" : false, `Lifestyle: drinks ${a.drink}/${b.drink}, smokes ${a.smoke}/${b.smoke}.`);

  /* values */
  const ov = overlap(a.values, b.values);
  add(8, ov.length >= 3 ? true : ov.length >= 1 ? "soft" : false,
    ov.length ? `Shared values: ${ov.join(", ")}.` : "No stated values in common.");

  /* --- deal breakers (the selection criteria) --- */
  const breaks = [];
  const checkSide = (me, them) => arr(me.dealBreakers).forEach(id => {
    const d = DB_BY_ID[id]; if (!d || d.manual || !d.test) return;
    if (d.test(me, them)) breaks.push({ who: me.first, label: d.label });
  });
  checkSide(a, b); checkSide(b, a);

  const manual = [];
  [[a, b], [b, a]].forEach(([me]) => arr(me.dealBreakers).forEach(id => {
    const d = DB_BY_ID[id]; if (d && d.manual) manual.push({ who: me.first, label: d.label });
  }));

  /* do-not-show list */
  const hl = (m, o) => (m.hideList || "").toLowerCase().split(/[\n,]/).map(s => s.trim()).filter(Boolean)
    .some(s => fullName(o).toLowerCase().includes(s) || (o.profession || "").toLowerCase().includes(s) || (o.phone || "").includes(s));
  const blocked = hl(a, b) || hl(b, a);

  const hard = f.filter(x => x.k === "no").length > 0;
  let out = Math.round(score / max * 100);
  if (hard) out = Math.min(out, 40);
  if (breaks.length) out = Math.min(out, 25);
  if (blocked) out = 0;
  return { score: out, flags: f, breaks, manual, blocked, hard };
}

/* ---------- tiny helpers ---------- */
function toast(msg) { const el = document.createElement("div"); el.className = "toast"; el.textContent = msg; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function sel(name, list, val, extra) { return `<select name="${name}" ${extra || ""}><option value="">Select…</option>` + list.map(o => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("") + `</select>`; }
function chipset(name, list, vals, multi, accent, maxN) {
  vals = arr(vals);
  return `<div class="chips" data-chips="${name}" data-multi="${multi ? 1 : 0}" data-max="${maxN || 0}">` +
    list.map(o => {
      const v = typeof o === "string" ? o : o.v, l = typeof o === "string" ? o : o.l;
      return `<span class="chip ${vals.includes(v) ? "on" : ""} ${accent ? "accent" : ""}" data-v="${esc(v)}">${esc(l)}</span>`;
    }).join("") + `</div>`;
}
function bindChips(root) {
  root.querySelectorAll("[data-chips]").forEach(box => {
    if (box.dataset.bound) return; box.dataset.bound = "1";
    box.addEventListener("click", e => {
      const c = e.target.closest(".chip"); if (!c) return;
      const maxN = +box.dataset.max || 0;
      if (box.dataset.multi === "1") {
        if (!c.classList.contains("on") && maxN && box.querySelectorAll(".chip.on").length >= maxN) {
          toast("Pick your top " + maxN + " — deselect one first."); return;
        }
        c.classList.toggle("on");
      } else {
        box.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
        c.classList.add("on");
      }
      if (maxN) paintMax(box, maxN);
      const cnt = box.parentElement.querySelector("[data-count]");
      if (cnt) cnt.innerHTML = `<b>${box.querySelectorAll(".chip.on").length}</b> of ${maxN} selected`;
    });
    if (+box.dataset.max) paintMax(box, +box.dataset.max);
  });
}
function paintMax(box, maxN) {
  const full = box.querySelectorAll(".chip.on").length >= maxN;
  box.querySelectorAll(".chip").forEach(c => c.classList.toggle("dim", full && !c.classList.contains("on")));
}
function chipVal(root, name, multi) {
  const box = root.querySelector(`[data-chips="${name}"]`); if (!box) return multi ? [] : "";
  const on = [...box.querySelectorAll(".chip.on")].map(c => c.dataset.v);
  return multi ? on : (on[0] || "");
}

    </div>

        <li>You can ask to see everything we hold about you, correct it, or have it deleted — at any time, and we will act within 30 days.</li>
      </ul>
      <label class="check"><input type="checkbox" name="dataConsent" ${d.dataConsent ? "checked" : ""}>
        <span>I consent to ${esc(BRAND.name)} holding and processing my information for the purpose of matching me.</span></label>

}

function afterApplyRender() {
  const inp = document.getElementById("photoInput");
  if (inp) inp.addEventListener("change", e => {
    [...e.target.files].slice(0, 3).forEach(f => {
      const r = new FileReader();
      r.onload = () => shrink(r.result, dataUrl => {
        DRAFT.photos.push(dataUrl);
        const prev = document.getElementById("photoPrev");
        if (prev) prev.insertAdjacentHTML("beforeend", `<img class="ph" src="${dataUrl}">`);
      });
      r.readAsDataURL(f);
    });
  });
}
function shrink(src, cb) {
  const img = new Image();
  img.onload = () => {
    const max = 420, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement("canvas"); c.width = img.width * s; c.height = img.height * s;
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    cb(c.toDataURL("image/jpeg", .72));
  };
  img.src = src;
}

function harvest() {
  const root = document.getElementById("stepbody"); if (!root) return;
  root.querySelectorAll("[name]").forEach(el => {
    if (el.type === "file") return;
    DRAFT[el.name] = el.type === "checkbox" ? el.checked : el.value;
  });
  root.querySelectorAll("[data-chips]").forEach(box => {
    const n = box.dataset.chips;
    DRAFT[n] = box.dataset.multi === "1" ? chipVal(root, n, true) : chipVal(root, n, false);
  });
}
function stepBack() { harvest(); if (STEP === 0) { cancelEdit(); return; } STEP--; render(); }

const LABELS = {
  first: "first name", lastName: "last name", email: "email", gender: "who you are",
  seeking: "who you'd like to meet", dob: "date of birth", city: "city", country: "country",
  journey: "your journey", relocate: "whether you'd relocate", faith: "faith",
  observance: "your level of practice", faithReq: "what you need from a partner's faith",
  values: "your values", education: "education", profession: "what you do",
  kidsWants: "whether you want children", familyInv: "family involvement",
  timeline: "your intentions", dealBreakers: "your two deal breakers"
};

function stepNext() {
  harvest();
  const need = [
    ["first", "lastName", "email", "gender", "seeking", "dob", "city", "country"],
    ["journey", "relocate"],
    ["faith", "observance", "faithReq", "values"],
    ["education", "profession", "kidsWants", "familyInv"],
    ["timeline", "dealBreakers"],
    []
  ][STEP];
  const missing = need.filter(k => !DRAFT[k] || (Array.isArray(DRAFT[k]) && !DRAFT[k].length));
  const errBox = document.getElementById("stepErr");
  if (missing.length) {
    errBox.innerHTML = `<div class="err">Please fill in: ${missing.map(k => LABELS[k] || k).join(", ")}.</div>`;
    return;
  }
  if (STEP === 4 && arr(DRAFT.dealBreakers).length !== 2) {
    errBox.innerHTML = `<div class="err">Please choose exactly two deal breakers — no more, no fewer.</div>`; return;
  }
  if (STEP === 0) {
    const a = age(DRAFT.dob);
    if (!a || a < BRAND.ageMin || a > BRAND.ageMax) {
      errBox.innerHTML = `<div class="err">${esc(BRAND.name)} is for ages ${BRAND.ageMin}${BRAND.ageMax >= 99 ? " and above" : "–" + BRAND.ageMax}. ${BRAND.sister ? "You may be a better fit for " + esc(BRAND.sister) + "." : ""}</div>`;
      return;
    }
  }
  if (STEP === STEPS.length - 1 && !DRAFT.conduct) {
    errBox.innerHTML = `<div class="err">Please read what we ask of members and tick the box to agree.</div>`; return;
  }
  if (STEP === STEPS.length - 1 && !DRAFT.dataConsent) {
    errBox.innerHTML = `<div class="err">Please give your consent for us to hold and process your information.</div>`; return;
  }
  errBox.innerHTML = "";
  if (STEP < STEPS.length - 1) { STEP++; render(); return; }
  submitApp();
}

function submitApp() {
  const d = DRAFT;
  if (EDIT_ID) {
    const ex = member(EDIT_ID);
    Object.assign(ex, d, {
      id: ex.id, created: ex.created, status: ex.status, notes: ex.notes,
      lastInitial: (d.lastName || "?")[0],
      ageMin: +d.ageMin || BRAND.dfMin, ageMax: +d.ageMax || BRAND.dfMax,
      updated: Date.now()
    });
    save(); EDIT_ID = null; DRAFT = null; go("portal");
    toast("Your details are updated.");
    return;
  }
  const m = Object.assign({}, d, {
    id: uid(), created: Date.now(), status: "pending",
    lastInitial: (d.lastName || "?")[0], notes: [],
    ageMin: +d.ageMin || BRAND.dfMin, ageMax: +d.ageMax || BRAND.dfMax
  });
  DB.members.push(m); save(); SESSION.memberId = m.id; DRAFT = null; go("submitted");
}

/* ============================================================

function slatesFor(id) { return DB.slates.filter(s => s.for === id && s.stage !== "closed"); }
function slatesAbout(id) { return DB.slates.filter(s => s.picked === id && s.stage !== "closed"); }
function optIds(s) { return s.opts.map(o => o.id); }
function involves(s, id) { return s.for === id || optIds(s).includes(id); }
function liveCount(id) { return DB.slates.filter(s => s.stage !== "closed" && involves(s, id)).length; }
function alreadySeen(id) {
  const set = new Set();
  DB.slates.forEach(s => { if (s.for === id) optIds(s).forEach(x => set.add(x)); if (optIds(s).includes(id)) set.add(s.for); });
  return set;
}
function unlocked(s) { return ["introduced", "talking", "dating", "engaged", "married"].includes(s.stage); }

  if (s.stage === "sent") {
    return `<div class="card" style="margin-bottom:18px">

      <h3 style="font-size:1.4rem;margin-bottom:4px">Choose the one you'd like to meet.</h3>
      <p class="hint">Take your time. You can choose one, or pass on both — passing costs you nothing and nobody is told.</p>
      <div class="slate">

      </div>
      <div style="margin-top:18px;text-align:center">
        <button class="btn btn-danger btn-sm" onclick="passSlate('${s.id}')">Neither is right for me</button>
      </div>
    </div>`;
  }

  const open = unlocked(s);

  </div>`;
}

function optionCard(s, o, me) {

function contactBlock(them) {

/* --- how did it go? (private to the matchmaker) --- */
let FB_EDIT = null;

function feedbackBlock(s, meId) {
  const f = (s.fb || {})[meId];
  if (f && FB_EDIT !== s.id + meId) {
    return `<div class="card" style="margin-top:16px;background:var(--sand);box-shadow:none">

        <dt>Treated well</dt><dd>${esc(f.respect)}</dd>
        <dt>Another introduction</dt><dd>${esc(f.again) || "—"}</dd>
      </dl>
      ${f.note ? `<div class="quote" style="margin-top:12px"><b>In your words</b>${esc(f.note)}</div>` : ""}
      <button class="btn btn-ghost btn-sm" style="margin-top:12px" onclick="FB_EDIT='${s.id + meId}';render()">Change my answer</button>
    </div>`;
  }
  const p = "fb_" + s.id + "_";
  return `<div class="card" style="margin-top:16px;background:var(--sand);box-shadow:none">
    <h4 class="sect-h" style="margin-top:0">How did it go?</h4>
    <p class="hint" style="margin-top:-6px">Only your matchmaker reads this — never the other person. It shapes what you're sent next,
    and it is how we keep this a place people are treated well.</p>
    <div class="row2">
      <div class="field"><label class="lb">Where you've got to</label>${sel(p + "met", FBQ.met, f && f.met)}</div>
      <div class="field"><label class="lb">How it felt</label>${sel(p + "went", FBQ.went, f && f.went)}</div>
    </div>
    <div class="row2">
      <div class="field"><label class="lb">Were you treated well?</label>${sel(p + "respect", FBQ.respect, f && f.respect)}</div>
      <div class="field"><label class="lb">Would you like another introduction?</label>${sel(p + "again", FBQ.again, f && f.again)}</div>
    </div>
    <div class="field"><label class="lb">Anything we should know?</label>
      <textarea name="${p}note" placeholder="Anything at all. It stays between us.">${esc((f && f.note) || "")}</textarea></div>
    <button class="btn btn-primary btn-sm" onclick="saveFeedback('${s.id}','${meId}')">Send to my matchmaker</button>
  </div>`;
}

function saveFeedback(sid, meId) {
  const s = DB.slates.find(x => x.id === sid);
  const p = "fb_" + sid + "_";
  const v = k => { const el = document.querySelector(`[name="${p}${k}"]`); return el ? el.value : ""; };
  if (!v("met") || !v("respect")) { toast("Tell us where you've got to and whether you were treated well."); return; }
  s.fb = s.fb || {};
  s.fb[meId] = { met: v("met"), went: v("went"), respect: v("respect"), again: v("again"), note: v("note"), t: Date.now() };
  s.log = s.log || [];
  s.log.push({ t: Date.now(), text: member(meId).first + " sent feedback" + (v("respect").indexOf("No") === 0 ? " — flagged a concern" : "") });
  FB_EDIT = null; save(); render();
  toast(v("respect").indexOf("No") === 0 ? "Thank you for telling us. Your matchmaker will call you." : "Thank you — that goes straight to your matchmaker.");
}

function concernSlates() {
  return DB.slates.filter(s => Object.values(s.fb || {}).some(f => (f.respect || "").indexOf("No") === 0));
}

function pickOne(sid, oid) {
  const s = DB.slates.find(x => x.id === sid);
  const other = s.opts.find(o => o.id !== oid);
  s.picked = oid; s.stage = "chosen"; s.theirRes = "pending";
  s.note = (s.opts.find(o => o.id === oid) || {}).note || "";
  s.log.push({ t: Date.now(), text: member(s.for).first + " chose " + member(oid).first + (other ? " over " + member(other.id).first : "") });
  save(); render(); toast("Chosen. They'll be asked now — we'll let you know.");
}
function passSlate(sid) {
  const s = DB.slates.find(x => x.id === sid);
  s.stage = "closed"; s.closedNote = "Passed on both";
  s.log.push({ t: Date.now(), text: member(s.for).first + " passed on both options" });
  save(); render(); toast("Noted — neither will be proposed to you again.");
}
function answer(sid, val) {
  const s = DB.slates.find(x => x.id === sid);
  s.theirRes = val;
  s.log.push({ t: Date.now(), text: member(s.picked).first + " " + (val === "accepted" ? "accepted" : "passed") });
  if (val === "accepted") { s.stage = "introduced"; s.log.push({ t: Date.now(), text: "Both accepted — details exchanged" }); }
  else { s.stage = "closed"; s.closedNote = "Declined the introduction"; }
  save(); render(); toast(val === "accepted" ? "The matchmaker will take it from here." : "Noted — you won't be proposed to them again.");
}

function addNote(id) {
  const t = document.getElementById("noteBox").value.trim(); if (!t) return;
  const m = member(id); m.notes = m.notes || []; m.notes.push({ id: uid(), t: Date.now(), text: t });
  save(); render(); toast("Note saved.");
}

/* ---- build a pair (two options) ---- */
function makeTab() {
  const pool = DB.members.filter(m => m.status === "approved");
  const a = ADM.pick && member(ADM.pick);
  const opts = `<option value="">Choose a member…</option>` +
    pool.map(m => `<option value="${m.id}" ${ADM.pick === m.id ? "selected" : ""}>${esc(fullName(m))} — ${age(m.dob)}, ${esc(place(m))}</option>`).join("");
  window.__pick = v => { ADM.pick = v || null; ADM.chosen = []; render(); };
  window.__toggle = id => {
    const i = ADM.chosen.indexOf(id);
    if (i >= 0) ADM.chosen.splice(i, 1);
    else { if (ADM.chosen.length >= 2) { toast("Two options only — deselect one first."); return; } ADM.chosen.push(id); }
    render();
  };
  let body = "";
  if (a) {
    const seen = alreadySeen(a.id);
    const cands = pool.filter(b => b.id !== a.id && !seen.has(b.id) && wants(a, b) && wants(b, a))
      .map(b => ({ b, c: compat(a, b) })).sort((x, y) => y.c.score - x.c.score);
    body = cands.length ? cands.map(({ b, c }) => `
      <div class="card" style="margin-bottom:14px;${ADM.chosen.includes(b.id) ? "border-color:var(--primary);box-shadow:0 0 0 3px var(--tint)" : ""}">
        <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start">
          <div style="display:flex;gap:14px;align-items:center">
            <div class="av" style="width:52px;height:52px">${b.photos && b.photos[0] ? `<img src="${b.photos[0]}">` : initials(b)}</div>
            <div><b style="font-family:var(--display);font-size:17px">${esc(fullName(b))}</b>
            <div style="color:var(--muted);font-size:13.8px">${age(b.dob)} · ${esc(place(b))} · ${esc(b.profession)}</div></div>
          </div>
          <div style="text-align:right">
            <div class="score" style="${c.breaks.length || c.hard ? "color:var(--red)" : ""}">${c.score}<span style="font-size:15px;color:var(--muted)">/100</span></div>
            ${c.breaks.length ? `<div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)">Deal breaker tripped</div>`
        : c.hard ? `<div style="font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--red)">Hard requirement missed</div>` : ""}
            <button class="btn ${ADM.chosen.includes(b.id) ? "btn-primary" : c.blocked ? "btn-ghost" : "btn-accent"} btn-sm" style="margin-top:8px"
              ${c.blocked ? "disabled" : ""} onclick="__toggle('${b.id}')">${ADM.chosen.includes(b.id) ? "✓ Selected" : "Select"}</button>
          </div>
        </div>
        ${c.breaks.length ? `<div style="margin-top:14px">${c.breaks.map(x => `<div class="flag no db"><i>✕</i><span><b>${esc(x.who)}'s deal breaker:</b> ${esc(x.label)}</span></div>`).join("")}</div>` : ""}
        <div style="margin-top:${c.breaks.length ? 4 : 14}px">${c.flags.map(x => `<div class="flag ${x.k}"><i>${x.k === "ok" ? "✓" : x.k === "no" ? "✕" : "!"}</i><span>${esc(x.t)}</span></div>`).join("")}</div>
        ${c.manual.length ? `<div class="flag hm" style="border-bottom:0"><i>⚑</i><span>Your judgement needed: ${c.manual.map(x => esc(x.who + " — " + x.label)).join("; ")}.</span></div>` : ""}
      </div>`).join("") : `<div class="empty">No un-proposed candidates left for ${esc(a.first)}.</div>`;
  }
  return `<div class="eyebrow">The actual work</div><h2>Build a pair</h2>
  <p class="hint" style="margin-bottom:18px">Pick a member, then select <b>two</b> candidates to send them. Everyone is scored against their
  stated requirements, and anyone who trips a deal breaker is capped and flagged in red.</p>
  <div class="toolbar"><select style="min-width:320px" onchange="__pick(this.value)">${opts}</select>
    ${a ? `<button class="btn btn-quiet btn-sm" onclick="__pick('')">Clear</button>` : ""}</div>
  ${a ? `<div class="card" style="margin-bottom:20px;background:var(--sand);box-shadow:none">
      <b style="font-family:var(--display);font-size:18px">${esc(fullName(a))}</b>
      <div style="color:var(--muted);font-size:14px">${age(a.dob)} · ${esc(place(a))} · ${esc(a.faith)} ${esc(a.denom === "N/A" ? "" : a.denom || "")} · seeking ${esc(a.seeking)}</div>
      <div style="margin-top:8px;font-size:14px">Wants: ${esc(a.faithReq)} · ages ${a.ageMin}–${a.ageMax} · ${esc(a.timeline)}</div>
      <div style="margin-top:10px">${dbLabels(a).map(l => `<span class="db-tag">✕ ${esc(l)}</span>`).join("")}</div>
      <div style="margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <b style="font-size:14px">${ADM.chosen.length} of 2 selected</b>
        <button class="btn btn-primary btn-sm" ${ADM.chosen.length !== 2 ? "disabled" : ""} onclick="openSend('${a.id}')">Send both to ${esc(a.first)}</button>
      </div>
    </div>` : `<div class="empty">Choose a member above to see ranked candidates.</div>`}
  ${body}`;
}
function wants(a, b) {
  if (!a.seeking) return a.gender !== b.gender;
  return (a.seeking === "Women" && b.gender === "Woman") || (a.seeking === "Men" && b.gender === "Man");
}

function openSend(forId) {
  const a = member(forId);
  const [x, y] = ADM.chosen.map(member);
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal">
    <div class="eyebrow">Two introductions</div>
    <h2>${esc(fullName(x))} &amp; ${esc(fullName(y))} → ${esc(a.first)}</h2>
    <p class="hint">${esc(a.first)} will see both side by side and choose one. Write a line for each — it's the reason they'll say yes.</p>
    <div class="field"><label class="lb">Why ${esc(x.first)}</label>
      <textarea id="n0">${esc(defaultNote(a, x))}</textarea></div>
    <div class="field"><label class="lb">Why ${esc(y.first)}</label>
      <textarea id="n1">${esc(defaultNote(a, y))}</textarea></div>
    <div style="display:flex;gap:10px;margin-top:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="this.closest('.modal-bg').remove()">Cancel</button>
      <button class="btn btn-primary" onclick="doSend('${forId}')">Send both</button>
    </div></div>`;
  bg.addEventListener("click", e => { if (e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
}
function defaultNote(a, b) {
  const bits = [];
  if (a.faith === b.faith) bits.push(`you're both ${a.faith}`);
  const ov = overlap(a.values, b.values);
  if (ov.length) bits.push(`you both put ${ov.slice(0, 2).join(" and ")} first`);
  if (sameArea(a, b)) bits.push(`you're both in ${b.city || b.state}`);
  if (a.timeline === b.timeline) bits.push(`you're at the same point`);
  return bits.length ? `On paper — ${bits.join(", ")}. But that's not why I'm putting them in front of you: ` : "";
}
function doSend(forId) {
  const notes = [document.getElementById("n0").value.trim(), document.getElementById("n1").value.trim()];
  DB.slates.push({
    id: uid(), for: forId, stage: "sent", created: Date.now(),
    opts: ADM.chosen.map((id, i) => ({ id, note: notes[i] })),
    picked: null, theirRes: "pending", note: "",
    log: [{ t: Date.now(), text: "Two options sent to " + member(forId).first }]
  });
  save(); document.querySelector(".modal-bg").remove();
  ADM.tab = "pipe"; ADM.pick = null; ADM.chosen = []; render();
  toast("Sent. They'll choose one.");
}

/* ---- pipeline ---- */
function slateTitle(s) {
  const a = member(s.for);
  if (s.picked) return fullName(a) + " & " + fullName(member(s.picked));
  return fullName(a) + " ← " + s.opts.map(o => (member(o.id) || {}).first).join(" / ");
}
function fbSummary(s) {
  const e = Object.entries(s.fb || {});
  if (!e.length) return "";
  return `<h4 class="sect-h">What they told you</h4>` + e.map(([id, f]) => {
    const bad = (f.respect || "").indexOf("No") === 0;
    return `<div class="note ${bad ? "note-alert" : ""}">
      <b>${esc((member(id) || {}).first || "—")}</b> — ${esc(f.met)}${f.went ? " · " + esc(f.went) : ""} ·
      treated well: <b>${esc(f.respect)}</b>${f.again ? " · another introduction: " + esc(f.again) : ""}
      ${f.note ? `<div style="margin-top:7px">“${esc(f.note)}”</div>` : ""}
      <small>${new Date(f.t).toLocaleDateString()}</small></div>`;
  }).join("");
}

function pipelineTab() {
  const live = DB.slates.filter(s => s.stage !== "closed").sort((x, y) => y.created - x.created);
  const closed = DB.slates.filter(s => s.stage === "closed");
  const row = s => {
    const a = member(s.for);
    return `<div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center">
        <div style="display:flex;align-items:center;gap:10px">
          <div class="av">${initials(a)}</div>
          ${s.opts.map((o, i) => { const b = member(o.id); return `<div class="av" style="margin-left:-16px;border:2px solid var(--white);${s.picked && s.picked !== o.id ? "opacity:.35" : ""}">${initials(b)}</div>`; }).join("")}
          <div style="margin-left:8px"><b style="font-family:var(--display);font-size:16.5px">${esc(slateTitle(s))}</b>
          <div style="font-size:13.2px;color:var(--muted)">Sent ${new Date(s.created).toLocaleDateString()} ·
            ${s.picked ? `${esc(a.first)} chose ${esc(member(s.picked).first)} · they: ${esc(s.theirRes)}` : "awaiting choice"}</div></div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="badge b-${["married", "engaged"].includes(s.stage) ? "married" : ["talking", "dating"].includes(s.stage) ? "talking" : s.stage === "introduced" ? "accepted" : "proposed"}">${STAGE_LABEL[s.stage]}</span>
          <select onchange="setStage('${s.id}',this.value)" style="width:auto;font-size:13.5px;padding:6px 10px">
            ${SLATE_STAGES.map(x => `<option value="${x}" ${s.stage === x ? "selected" : ""}>${STAGE_LABEL[x]}</option>`).join("")}
          </select>
        </div>
      </div>
      ${s.opts.map(o => o.note ? `<div class="quote" style="margin-top:12px"><b>Your note about ${esc((member(o.id) || {}).first)}</b>${esc(o.note)}</div>` : "").join("")}
      ${fbSummary(s)}
      <details style="margin-top:10px"><summary style="cursor:pointer;font-size:13.5px;color:var(--muted)">History (${(s.log || []).length})</summary>
        <div style="margin-top:8px">${(s.log || []).map(l => `<div class="flag ok"><i>·</i><span>${new Date(l.t).toLocaleDateString()} — ${esc(l.text)}</span></div>`).join("")}</div>
      </details>
    </div>`;
  };
  const concerns = concernSlates();
  return `<div class="eyebrow">Tracking</div><h2>Introductions</h2>
  <p class="hint" style="margin-bottom:18px">Everything you're currently holding in your head, written down.</p>
  ${concerns.length ? `<div class="card" style="border-left:4px solid var(--red);margin-bottom:18px">
    <b>${concerns.length} introduction${concerns.length > 1 ? "s" : ""} need${concerns.length > 1 ? "" : "s"} a call from you.</b>
    <p style="margin:6px 0 0;font-size:14.4px;color:var(--ink-2)">Someone has asked to speak to you about how they were treated.
    Handle it before you send them anything else.</p></div>` : ""}
  ${live.length ? live.map(row).join("") : `<div class="empty">Nothing live. Go build a pair.</div>`}
  ${closed.length ? `<h4 class="sect-h">Closed (${closed.length})</h4>${closed.map(row).join("")}` : ""}`;
}
function setStage(id, s) {
  const sl = DB.slates.find(x => x.id === id); sl.stage = s;
  sl.log = sl.log || []; sl.log.push({ t: Date.now(), text: "Stage → " + STAGE_LABEL[s] });
  save(); render(); toast("Updated.");
}

/* ---- boot ---- */
loadDB(); seed(); render();

</script>
</body>
</html>
